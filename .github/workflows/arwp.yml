name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - '.arwp/**'
      - 'api/**'
      - 'mcp/**'
      - 'for-ai/**'
      - 'crawler-matrix/**'
      - 'evidence/claims/**'
      - 'observatory/**'
      - 'media/**'
      - 'trust/**'
      - 'growth/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply-brand-shell.mjs'
      - 'scripts/enhance-hack-discovery.mjs'
      - 'scripts/check-hack-discovery.mjs'
      - 'scripts/apply-internal-discovery-distribution.mjs'
      - 'scripts/check-internal-discovery-distribution.mjs'
      - '.github/workflows/arwp.yml'
      - '.github/workflows/arwp-growth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - '.arwp/**'
      - 'api/**'
      - 'mcp/**'
      - 'for-ai/**'
      - 'crawler-matrix/**'
      - 'evidence/claims/**'
      - 'observatory/**'
      - 'media/**'
      - 'trust/**'
      - 'growth/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply-brand-shell.mjs'
      - 'scripts/enhance-hack-discovery.mjs'
      - 'scripts/check-hack-discovery.mjs'
      - 'scripts/apply-internal-discovery-distribution.mjs'
      - 'scripts/check-internal-discovery-distribution.mjs'
      - '.github/workflows/arwp.yml'
      - '.github/workflows/arwp-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@793483e3404a97f7892e86bcda3fd317d5c7427c
        with:
          profile: ai/site-profile.json

      - name: Validate Brali Internal Discovery contract
        run: node -e "const c=require('./.arwp/internal-discovery.json'); if(c.arwpRevision!=='793483e3404a97f7892e86bcda3fd317d5c7427c'||c.findings?.length!==10) process.exit(1); console.log('Brali Internal Discovery contract OK')"
