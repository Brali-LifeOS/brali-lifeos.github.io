name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'api/**'
      - 'mcp/**'
      - 'for-ai/**'
      - 'crawler-matrix/**'
      - 'evidence/claims/**'
      - 'observatory/**'
      - 'media/**'
      - 'trust/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply-brand-shell.mjs'
      - '.github/workflows/arwp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - 'api/**'
      - 'mcp/**'
      - 'for-ai/**'
      - 'crawler-matrix/**'
      - 'evidence/claims/**'
      - 'observatory/**'
      - 'media/**'
      - 'trust/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply-brand-shell.mjs'
      - '.github/workflows/arwp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@c1d51698e3765d0817ee14bcbc36c67297457260
        with:
          profile: ai/site-profile.json
