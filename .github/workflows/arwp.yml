name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'api/**'
      - 'mcp/**'
      - 'for-ai/**'
      - 'crawler-matrix/**'
      - 'evidence/claims/**'
      - 'observatory/**'
      - 'media/**'
      - 'trust/**'
      - 'growth/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply-brand-shell.mjs'
      - 'scripts/enhance-hack-discovery.mjs'
      - 'scripts/check-hack-discovery.mjs'
      - '.github/workflows/arwp.yml'
      - '.github/workflows/arwp-growth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - 'api/**'
      - 'mcp/**'
      - 'for-ai/**'
      - 'crawler-matrix/**'
      - 'evidence/claims/**'
      - 'observatory/**'
      - 'media/**'
      - 'trust/**'
      - 'growth/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/apply-brand-shell.mjs'
      - 'scripts/enhance-hack-discovery.mjs'
      - 'scripts/check-hack-discovery.mjs'
      - '.github/workflows/arwp.yml'
      - '.github/workflows/arwp-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@b0862b14da0a6c9c8cf203c905091cc66eb5a9f8
        with:
          profile: ai/site-profile.json
