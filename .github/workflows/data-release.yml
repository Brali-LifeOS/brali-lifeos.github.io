name: Package Brali data release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dataset version, for example 1.0.0
        required: true
        type: string
  push:
    tags:
      - 'data-v*'
    branches:
      - 'release/data-v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#data-v}"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == release/data-v* ]]; then
            VERSION="${GITHUB_REF_NAME#release/data-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid data release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and validate
        run: npm run build && npm run check
      - name: Package immutable dataset snapshot
        run: npm run release:data -- --version "${{ steps.version.outputs.version }}"
      - name: Verify packaged snapshot
        run: npm run release:check -- --version "${{ steps.version.outputs.version }}"
      - name: Create archive
        shell: bash
        run: |
          cd releases
          tar -czf "brali-data-${{ steps.version.outputs.version }}.tar.gz" "data-v${{ steps.version.outputs.version }}"
          sha256sum "brali-data-${{ steps.version.outputs.version }}.tar.gz" > "brali-data-${{ steps.version.outputs.version }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: brali-data-${{ steps.version.outputs.version }}
          path: |
            releases/data-v${{ steps.version.outputs.version }}/
            releases/brali-data-${{ steps.version.outputs.version }}.tar.gz
            releases/brali-data-${{ steps.version.outputs.version }}.tar.gz.sha256
      - name: Create immutable data tag from verified release branch
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/data-v')
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="data-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable tag ${TAG}." >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
      - name: Publish GitHub release
        if: github.ref_type == 'tag' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'release/data-v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="data-v${VERSION}"
          BUNDLE="releases/data-v${VERSION}"
          gh release create "$TAG" \
            "releases/brali-data-${VERSION}.tar.gz" \
            "releases/brali-data-${VERSION}.tar.gz.sha256" \
            "${BUNDLE}/release-manifest.json" \
            "${BUNDLE}/SHA256SUMS" \
            "${BUNDLE}/CITATION.cff" \
            "${BUNDLE}/LICENSE" \
            --title "Brali data ${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"
