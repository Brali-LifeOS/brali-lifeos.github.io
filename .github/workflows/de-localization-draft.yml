name: German localization draft guards

on:
  push:
    paths:
      - "data/localization/de/**"
      - "scripts/check-de-library-contract.mjs"
      - "scripts/audit-de-library-language.mjs"
      - "scripts/lib/de-language-audit.mjs"
      - "scripts/plan-de-library-next.mjs"
      - ".github/workflows/de-localization-draft.yml"
  pull_request:
    paths:
      - "data/localization/de/**"
      - "scripts/check-de-library-contract.mjs"
      - "scripts/audit-de-library-language.mjs"
      - "scripts/lib/de-language-audit.mjs"
      - "scripts/plan-de-library-next.mjs"
      - ".github/workflows/de-localization-draft.yml"

permissions:
  contents: read

jobs:
  german-draft-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check German canonical subset and source snapshots
        run: node scripts/check-de-library-contract.mjs
      - name: Audit German library language
        run: node scripts/audit-de-library-language.mjs
      - name: Show next canonical German records
        run: node scripts/plan-de-library-next.mjs --limit=30

  german-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Require complete German canonical corpus
        run: node scripts/check-de-library-contract.mjs --complete
      - name: Run strict German language audit
        run: node scripts/audit-de-library-language.mjs --strict
