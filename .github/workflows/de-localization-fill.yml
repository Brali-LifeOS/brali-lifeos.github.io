name: German localization progress planner

on:
  push:
    branches:
      - deep-run/de-full-localization-20260914
    paths:
      - 'data/localization/de/library/**'
      - 'data/life-os-content/**'
      - 'scripts/check-de-library-contract.mjs'
      - 'scripts/audit-de-library-language.mjs'
      - 'scripts/lib/de-language-audit.mjs'
      - 'scripts/plan-de-library-next.mjs'
      - '.github/workflows/de-localization-fill.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: de-localization-progress
  cancel-in-progress: true

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check current German canonical subset
        run: node scripts/check-de-library-contract.mjs

      - name: Audit current German language quality
        run: node scripts/audit-de-library-language.mjs

      - name: Show remaining canonical German records
        run: node scripts/plan-de-library-next.mjs --limit=250
