name: German localization bounded fill

on:
  push:
    branches:
      - deep-run/de-full-localization-20260914
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: de-localization-fill
  cancel-in-progress: false

jobs:
  fill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fill the next bounded German batches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GERMAN_LOCALIZATION_MODEL: openai/gpt-4.1-mini
          GERMAN_LOCALIZATION_BATCH_SIZE: '8'
          GERMAN_LOCALIZATION_MAX_BATCHES: '8'
        run: node scripts/generate-de-missing-localization.mjs

      - name: Commit generated German batches
        shell: bash
        run: |
          if git diff --quiet -- data/localization/de/library; then
            echo "No German library changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/localization/de/library
          git commit -m "Fill next German localization batches"
          git push origin HEAD:${{ github.ref_name }}
