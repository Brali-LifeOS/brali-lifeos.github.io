name: Interface localization release guards

on:
  push:
    branches:
      - agent/de-localization
    paths:
      - 'package.json'
      - '.arwp/localization.json'
      - 'data/localization/de/**'
      - 'data/localization/ru/**'
      - 'data/life-os-content/**'
      - 'data/life-os-content-additions.json'
      - 'scripts/build-interface-locales.mjs'
      - 'scripts/check-interface-locale-sources.mjs'
      - 'scripts/check-interface-locales.mjs'
      - 'scripts/complete-localization-clusters.mjs'
      - 'scripts/check-localization-artifact.mjs'
      - 'scripts/migrate-ru-generic-source-parity.mjs'
      - 'scripts/audit-ru-language.mjs'
      - 'scripts/audit-de-language.mjs'
      - 'scripts/audit-de-library-language.mjs'
      - 'scripts/check-de-library-contract.mjs'
      - 'scripts/lib/de-language-audit.mjs'
      - 'scripts/lib/localization-source.mjs'
      - '.github/workflows/de-localization-release.yml'
  pull_request:
    paths:
      - 'package.json'
      - '.arwp/localization.json'
      - 'data/localization/de/**'
      - 'data/localization/ru/**'
      - 'data/life-os-content/**'
      - 'data/life-os-content-additions.json'
      - 'scripts/build-interface-locales.mjs'
      - 'scripts/check-interface-locale-sources.mjs'
      - 'scripts/check-interface-locales.mjs'
      - 'scripts/complete-localization-clusters.mjs'
      - 'scripts/check-localization-artifact.mjs'
      - 'scripts/migrate-ru-generic-source-parity.mjs'
      - 'scripts/audit-ru-language.mjs'
      - 'scripts/audit-de-language.mjs'
      - 'scripts/audit-de-library-language.mjs'
      - 'scripts/check-de-library-contract.mjs'
      - 'scripts/lib/de-language-audit.mjs'
      - 'scripts/lib/localization-source.mjs'
      - '.github/workflows/de-localization-release.yml'

permissions:
  contents: read

jobs:
  interface-localization-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check localization hardening syntax
        run: |
          node --check scripts/complete-localization-clusters.mjs
          node --check scripts/check-localization-artifact.mjs
          node --check scripts/migrate-ru-generic-source-parity.mjs
      - name: Check localization source parity
        run: node scripts/check-interface-locale-sources.mjs
      - name: Audit Russian public-interface language
        run: node scripts/audit-ru-language.mjs
      - name: Require complete German canonical corpus
        run: node scripts/check-de-library-contract.mjs --complete
      - name: Run strict German library language audit
        run: node scripts/audit-de-library-language.mjs --strict
      - name: Audit German public-interface language
        run: node scripts/audit-de-language.mjs
      - name: Build exact site artifact
        run: npm run build
      - name: Complete EN/RU/DE locale clusters
        run: node scripts/complete-localization-clusters.mjs
      - name: Check generated interface-locale contract
        run: node scripts/check-interface-locales.mjs
      - name: Gate exact multilingual artifact
        run: node scripts/check-localization-artifact.mjs
