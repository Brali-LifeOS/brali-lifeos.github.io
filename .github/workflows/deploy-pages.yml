name: Verify and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate installable Brali Agent Skills library
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: gh skill publish agent-skills --dry-run
      - name: Validate single-router Agent Skill distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: node scripts/check-router-skill-distribution.mjs && gh skill publish distribution/github-skill --dry-run
      - name: Validate MCP v2 imports
        run: cd mcp && npm install --ignore-scripts --package-lock=false && node -e "import('./remote.mjs')"
      - name: Validate Trustverse classification policy
        run: node scripts/check-content-trust-policy.mjs
      - name: Enforce append-only hack review history
        run: node scripts/check-hack-review-append-only.mjs
      - name: Check lifecycle research and localization syntax
        run: |
          node --check scripts/enrich-hack-lifecycle-evidence.mjs
          node --check scripts/build-research-lifecycle-watchlist.mjs
          node --check scripts/build-ru-lifecycle-surfaces.mjs
          node --check scripts/check-lifecycle-research-localization.mjs
          node --check scripts/finalize-hack-lifecycle-discovery.mjs
      - name: Check localization release verifier syntax
        run: |
          node --check scripts/check-live-localizations.mjs
          node --check scripts/check-live-localization-cluster.mjs
          node --check scripts/check-browser-localizations.mjs
          node --check scripts/run-localization-release-gates.mjs
          node --check scripts/run-localization-build.mjs
          node --check scripts/run-localization-checks.mjs
          node --check scripts/check-localization-contract.mjs
          node --check scripts/check-localization-faults.mjs
          node --check scripts/check-ru-consent-localization.mjs
          node --check scripts/audit-ru-language.mjs
          node --check scripts/patch-ru-discovery.mjs
          node --check scripts/build-interface-locales.mjs
          node --check scripts/finalize-interface-locales.mjs
          node --check scripts/finalize-localization-cluster.mjs
          node --check scripts/build-indexability-registry.mjs
          node --check scripts/check-indexability-contract.mjs
          node --check scripts/check-interface-locale-sources.mjs
          node --check scripts/check-interface-locales.mjs
          node --check scripts/check-de-library-contract.mjs
          node --check scripts/audit-de-library-language.mjs
          node --check scripts/audit-de-language.mjs
          node --check scripts/check-localization-cluster.mjs
          node --check scripts/check-pages-localization-artifact.mjs
      - name: Validate localization source contract and adversarial failures
        run: |
          npm run localization:contract
          npm run localization:faults
          npm run localization:audit:ru
          npm run localization:sources
          node scripts/check-de-library-contract.mjs --complete
          npm run localization:audit:de
      - name: Build site
        run: npm run build
      - name: Gate research lifecycle and Russian trust parity
        run: npm run lifecycle:check
      - name: Verify localized analytics consent
        run: node scripts/check-ru-consent-localization.mjs
      - name: Check localization impact against PR base
        if: github.event_name == 'pull_request'
        env:
          LOCALIZATION_BASE_REF: origin/${{ github.base_ref }}
        run: npm run localization:check
      - name: Build portable Brali Bench
        run: node scripts/build-brali-bench.mjs && node scripts/check-brali-bench.mjs
      - name: Validate shared stdio and remote MCP source
        run: node --check mcp/core.mjs && node --check mcp/server.mjs && node --check mcp/remote.mjs && node scripts/check-mcp-contract.mjs
      - name: Build one Agent Skill per hack from final evidence state
        run: npm run skills:build
      - name: Validate generated Agent Skills library
        run: npm run skills:check
      - name: Gate Trustverse coverage at 900 usable records
        env:
          TRUSTVERSE_TARGET: 900
        run: node scripts/check-trustverse-target.mjs
      - name: Run full repository checks
        run: npm run check
      - name: Recheck portable Brali Bench after repository checks
        run: node scripts/check-brali-bench.mjs
      - name: Check AI search profile
        run: node scripts/check-ai-search-profile.mjs
      - name: Finalize hack lifecycle discovery
        run: node scripts/finalize-hack-lifecycle-discovery.mjs
      - name: Normalize final sitemap to canonical indexable URLs
        run: node scripts/normalize-search-sitemap.mjs
      - name: Apply Image Discovery to exact final artifact
        run: node scripts/apply-image-discovery.mjs
      - name: Gate final Image Discovery surface
        run: node scripts/check-image-discovery.mjs
      - name: Apply Internal Discovery & Distribution to exact final artifact
        run: node scripts/apply-internal-discovery-distribution.mjs
      - name: Gate final Internal Discovery & Distribution surface
        run: node scripts/check-internal-discovery-distribution.mjs
      - name: Stage Goose ARWP Proof Mark
        run: node scripts/inject-goose-proof-mark.mjs .
      - name: Gate Brali Bench final artifact
        shell: bash
        run: |
          test -s bench/index.html
          test -s bench/manifest.json
          test -s bench/cases.json
          test -s bench/results.json
          grep -q 'https://brali-lifeos.github.io/bench/' sitemap.xml
          grep -q 'https://brali-lifeos.github.io/bench/' llms.txt
      - name: Gate hack lifecycle final artifact
        shell: bash
        run: |
          grep -q 'https://brali-lifeos.github.io/life-os/review-log/' sitemap.xml
          grep -q 'https://brali-lifeos.github.io/sponsorship/' sitemap.xml
          grep -q 'https://brali-lifeos.github.io/ru/life-os/review-log/' sitemap.xml
          grep -q 'https://brali-lifeos.github.io/ru/sponsorship/' sitemap.xml
          ! grep -q 'https://brali-lifeos.github.io/research/review-watchlist/' sitemap.xml
          grep -q 'https://brali-lifeos.github.io/life-os/datasets/reviews.json' llms.txt
          grep -q 'https://brali-lifeos.github.io/life-os/datasets/research-lifecycle-watchlist.json' llms.txt
          grep -q 'https://brali-lifeos.github.io/ru/life-os/review-log/' llms.txt
          grep -q 'Hack review log' life-os/review-log/index.html
          grep -q 'Sponsor the work, never the verdict' sponsorship/index.html
          grep -q 'Metadata is not a verdict' research/review-watchlist/index.html
          grep -q 'noindex,follow' research/review-watchlist/index.html
          grep -q 'Журнал проверок' ru/life-os/review-log/index.html
          grep -q 'Покупать вывод — нельзя' ru/sponsorship/index.html
          test -s life-os/datasets/reviews.json
          test -s life-os/datasets/research-lifecycle-watchlist.json
          npm run lifecycle:check
      - name: Gate exact final localization Pages artifact
        run: npm run localization:cluster && npm run localization:artifact && node scripts/check-indexability-contract.mjs
      - name: Gate exact final Pages artifact
        run: node scripts/check-search-release.mjs
      - name: Upload verified Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout deployed source revision
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify all release locales over live HTTP
        run: node scripts/run-localization-release-gates.mjs live
      - name: Verify reciprocal locale cluster for deployed SHA
        run: node scripts/check-live-localization-cluster.mjs
      - name: Install Chromium localization verification runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Verify all release locales in real Chromium
        run: node scripts/run-localization-release-gates.mjs browser
      - name: Verify live Pages release
        run: node scripts/check-live-search-release.mjs
