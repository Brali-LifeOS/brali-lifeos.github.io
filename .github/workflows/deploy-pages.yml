name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brali-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate installable Brali Agent Skills library
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: gh skill publish agent-skills --dry-run
      - name: Validate single-router Agent Skill distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: node scripts/check-router-skill-distribution.mjs && gh skill publish distribution/github-skill --dry-run
      - name: Validate MCP v2 imports
        run: cd mcp && npm install --ignore-scripts --package-lock=false && node -e "import('./remote.mjs')"
      - name: Validate Trustverse classification policy
        run: node scripts/check-content-trust-policy.mjs
      - name: Build site
        run: npm run build
      - name: Build portable Brali Bench
        run: node scripts/build-brali-bench.mjs && node scripts/check-brali-bench.mjs
      - name: Validate shared stdio and remote MCP source
        run: node --check mcp/core.mjs && node --check mcp/server.mjs && node --check mcp/remote.mjs && node scripts/check-mcp-contract.mjs
      - name: Build one Agent Skill per hack from final evidence state
        run: npm run skills:build
      - name: Validate generated Agent Skills library
        run: npm run skills:check
      - name: Gate Trustverse coverage at 900 usable records
        env:
          TRUSTVERSE_TARGET: 900
        run: node scripts/check-trustverse-target.mjs
      - name: Run full repository checks
        run: npm run check
      - name: Recheck portable Brali Bench after repository checks
        run: node scripts/check-brali-bench.mjs
      - name: Check AI search profile
        run: node scripts/check-ai-search-profile.mjs
      - name: Normalize final sitemap to canonical indexable URLs
        run: node scripts/normalize-search-sitemap.mjs
      - name: Apply Image Discovery to exact final artifact
        run: node scripts/apply-image-discovery.mjs
      - name: Gate final Image Discovery surface
        run: node scripts/check-image-discovery.mjs
      - name: Apply Internal Discovery & Distribution to exact final artifact
        run: node scripts/apply-internal-discovery-distribution.mjs
      - name: Gate final Internal Discovery & Distribution surface
        run: node scripts/check-internal-discovery-distribution.mjs
      - name: Gate Brali Bench final artifact
        shell: bash
        run: |
          test -s bench/index.html
          test -s bench/manifest.json
          test -s bench/cases.json
          test -s bench/results.json
          grep -q 'https://brali-lifeos.github.io/bench/' sitemap.xml
          grep -q 'https://brali-lifeos.github.io/bench/' llms.txt
      - name: Gate exact final Pages artifact
        run: node scripts/check-search-release.mjs
      - name: Upload verified Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout deployed source revision
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify live Brali Bench
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 https://brali-lifeos.github.io/bench/ | grep -q 'Brali Bench'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 https://brali-lifeos.github.io/bench/manifest.json | grep -q 'structured-brali'
      - name: Verify live Image Discovery surface
        run: node scripts/check-live-image-discovery.mjs
      - name: Verify live Internal Discovery & Distribution surface
        run: node scripts/check-live-internal-discovery-distribution.mjs
