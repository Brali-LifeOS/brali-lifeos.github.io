name: Google Search Pipeline
on:
  workflow_dispatch:
    inputs:
      max_inspections: { description: Maximum page URLs to inspect, required: false, default: 500, type: number }
      inspection_mode: { description: URL selection mode, required: false, default: all, type: choice, options: [all, priority, rotate] }
  schedule: [{ cron: "47 5 * * *" }]
permissions: { contents: read, actions: read }
jobs:
  google-search:
    uses: dkharlanau/dkharlanau.github.io/.github/workflows/google-search-reusable.yml@88f3a30a721d762517a179c9ebe93526792b6065
    with:
      site_url: https://brali-lifeos.github.io/
      sitemap_url: https://brali-lifeos.github.io/sitemap.xml
      runner_ref: 88f3a30a721d762517a179c9ebe93526792b6065
      max_inspections: ${{ github.event_name == 'schedule' && 120 || inputs.max_inspections }}
      inspection_mode: ${{ github.event_name == 'schedule' && 'rotate' || inputs.inspection_mode }}
    secrets:
      google_search_console_service_account: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}

  brali-measurement:
    needs: google-search
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brali measurement contract
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download current Google Search report
        uses: actions/download-artifact@v4
        with:
          name: google-search-report
          path: reports/seo/google-search

      - name: Build Brali segmented search measurement
        run: |
          node scripts/build-search-console-measurement.mjs --config-check
          node scripts/build-search-console-measurement.mjs

      - name: Add Brali measurement to workflow summary
        run: cat reports/seo/google-search/brali-search-measurement.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Brali search measurement
        uses: actions/upload-artifact@v4
        with:
          name: brali-search-measurement
          path: |
            reports/seo/google-search/brali-search-measurement.json
            reports/seo/google-search/brali-search-measurement.md
          if-no-files-found: error
          retention-days: 90
