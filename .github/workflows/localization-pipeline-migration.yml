name: Localization pipeline convergence

on:
  push:
    branches:
      - agent/de-localization
    paths:
      - 'scripts/migrate-localization-pipeline.mjs'
      - '.github/workflows/localization-pipeline-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Converge localization build pipeline
        run: node scripts/migrate-localization-pipeline.mjs
      - name: Verify migrated files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
          node --check scripts/check-interface-locales.mjs
          node --check scripts/build-localized-machine-surfaces.mjs
      - name: Commit localization pipeline convergence
        shell: bash
        run: |
          if git diff --quiet -- package.json scripts/check-interface-locales.mjs; then
            echo "No localization pipeline changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/check-interface-locales.mjs
          git commit -m "Generalize locale machine-surface pipeline"
          git push origin HEAD:${{ github.ref_name }}
