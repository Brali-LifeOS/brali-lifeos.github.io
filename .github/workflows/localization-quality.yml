name: Localization quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check live localization verifier syntax
        run: node --check scripts/check-live-localizations.mjs
      - name: Check Russian discovery patch syntax
        run: node --check scripts/patch-ru-discovery.mjs
      - name: Build effective canonical corpus and localized surfaces
        run: npm run build
      - name: Report remaining Russian localization gaps
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          const canonical = JSON.parse(await readFile('data/life-os-content/index.json', 'utf8'));
          const flagships = JSON.parse(await readFile('data/localization/ru/flagships.json', 'utf8'));
          const localized = new Set((flagships.entries || []).map((entry) => entry.slug));
          for (const name of (await readdir('data/localization/ru/library')).filter((name) => name.endsWith('.json')).sort()) {
            const batch = JSON.parse(await readFile(`data/localization/ru/library/${name}`, 'utf8'));
            for (const record of batch.records || []) localized.add(record.slug);
          }
          const missing = canonical.filter((entry) => !localized.has(entry.slug)).map((entry) => entry.slug);
          console.log(`RU_LOCALIZED=${localized.size}; RU_CANONICAL=${canonical.length}; RU_MISSING=${missing.length}`);
          console.log(`RU_MISSING_SLUGS=${missing.join(', ')}`);
          NODE
      - name: Check localization contract and rendered invariants
        run: npm run localization:check
      - name: Check localization impact against PR base
        if: github.event_name == 'pull_request'
        env:
          LOCALIZATION_BASE_REF: origin/${{ github.base_ref }}
        run: npm run localization:check
