name: Localization quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/ru-localization-next-scan-20260913]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Print next RU localization candidates
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import { loadRussianLocalizationAuthoringIndex, localizationSourceSnapshot } from './scripts/lib/ru-localization-source.mjs';
          const canonical = JSON.parse(await readFile('data/life-os-content/index.json', 'utf8'));
          const authoring = await loadRussianLocalizationAuthoringIndex(process.cwd());
          const sourceBySlug = new Map(authoring.map((entry) => [entry.slug, entry]));
          const flagships = JSON.parse(await readFile('data/localization/ru/flagships.json', 'utf8'));
          const localized = new Set((flagships.entries || []).map((entry) => entry.slug));
          const names = (await readdir('data/localization/ru/library')).filter((name) => name.endsWith('.json')).sort();
          for (const name of names) {
            const batch = JSON.parse(await readFile(`data/localization/ru/library/${name}`, 'utf8'));
            for (const record of batch.records || []) localized.add(record.slug);
          }
          const next = canonical.filter((entry) => !localized.has(entry.slug)).slice(0, 30).map((entry) => ({
            slug: entry.slug,
            source: localizationSourceSnapshot(sourceBySlug.get(entry.slug) || entry),
          }));
          console.log('RU_NEXT_BEGIN');
          console.log(JSON.stringify(next, null, 2));
          console.log('RU_NEXT_END');
          console.log(`RU_LOCALIZED=${localized.size}; RU_CANONICAL=${canonical.length}; RU_MISSING=${canonical.length - localized.size}`);
          NODE
      - name: Check live localization verifier syntax
        run: node --check scripts/check-live-localizations.mjs
      - name: Build declared localized surfaces
        run: npm run localization:build
      - name: Check localization contract and rendered invariants
        run: npm run localization:check
      - name: Check localization impact against PR base
        if: github.event_name == 'pull_request'
        env:
          LOCALIZATION_BASE_REF: origin/${{ github.base_ref }}
        run: npm run localization:check
