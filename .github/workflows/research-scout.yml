name: Research scout

on:
  schedule:
    - cron: "23 5 * * 1"
    - cron: "47 5 1 * *"
  workflow_dispatch:
    inputs:
      generate_monthly_digest:
        description: "Generate a calendar-month research digest"
        required: false
        default: false
        type: boolean
      digest_month:
        description: "Optional digest month (YYYY-MM); defaults to previous calendar month"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: brali-research-scout
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preserve open scout queue
        shell: bash
        run: |
          git fetch origin bot/research-scout:refs/remotes/origin/bot/research-scout || true
          if git show-ref --verify --quiet refs/remotes/origin/bot/research-scout; then
            git show origin/bot/research-scout:data/research-candidates.json > /tmp/research-candidates.json || true
          fi
          git checkout -B bot/research-scout origin/main
          if [ -s /tmp/research-candidates.json ]; then cp /tmp/research-candidates.json data/research-candidates.json; fi
      - name: Discover research candidates
        run: python scripts/research_scout.py --days 60 --rows 8 --providers crossref,europepmc
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          EUROPEPMC_EMAIL: ${{ vars.CROSSREF_MAILTO }}
      - name: Generate monthly research digest
        if: github.event.schedule == '47 5 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.generate_monthly_digest == true)
        shell: bash
        run: |
          if [ -n "${{ inputs.digest_month }}" ]; then
            python scripts/monthly_research_digest.py --month "${{ inputs.digest_month }}"
          else
            python scripts/monthly_research_digest.py
          fi
      - name: Validate research system
        run: python scripts/check-research-system.py
      - name: Commit scout outputs
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/research-candidates.json data/monthly-digests research/monthly)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "brali-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research-candidates.json data/monthly-digests research/monthly
          git commit -m "Update research scout outputs"
          git push --force origin HEAD:bot/research-scout
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or refresh research PR
        continue-on-error: true
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER="$(gh pr list --head bot/research-scout --base main --state open --json number --jq '.[0].number // empty')"
          BODY="Automated Brali research-scout update from Crossref and Europe PMC. Candidate records are unreviewed leads only. Duplicate scholarly identities are merged by DOI/PMID while discovery provenance is preserved. On the first day of each month this same loop also generates an audit digest for the previous calendar month from canonical research registries and Git history. Review the actual source before promoting any candidate into a hack, protocol, or evidence state."
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head bot/research-scout --title "Research scout: review new candidates and digest" --body "$BODY"
          else
            gh pr edit "$PR_NUMBER" --body "$BODY"
          fi
