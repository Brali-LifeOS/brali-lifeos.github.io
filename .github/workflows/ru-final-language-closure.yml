name: Apply Russian final language closures

on:
  push:
    branches:
      - deep-run/ru-final-closure-20260914

permissions:
  contents: write

concurrency:
  group: ru-final-language-closure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deep-run/ru-final-closure-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply reviewed authoring changes
        run: node scripts/apply-ru-final-language-closures.mjs
      - name: Commit normalized authoring files when needed
        shell: bash
        run: |
          if git diff --quiet -- data/localization/ru/library; then
            echo "No authoring changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/localization/ru/library
          git commit -m "fix(localization): close remaining Russian language findings"
          git push origin HEAD:deep-run/ru-final-closure-20260914
