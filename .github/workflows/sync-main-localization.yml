name: Probe main localization merge

on:
  push:
    branches:
      - agent/de-localization
    paths:
      - '.github/workflows/sync-main-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/de-localization
          fetch-depth: 0
      - name: Configure identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Probe merge against current main
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'MERGE_CLEAN'
            git merge --abort || true
            exit 0
          fi
          echo 'CONFLICTS_START'
          git diff --name-only --diff-filter=U
          echo 'CONFLICTS_END'
          git merge --abort || true
          exit 1
