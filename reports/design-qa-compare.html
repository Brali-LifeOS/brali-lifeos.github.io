<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brali design QA comparison</title>
  <style>

  </style>
</head>
<body>
  <main>
    <figure><figcaption>Selected design reference</figcaption><img src="/reports/design-reference-option-3.png" alt="Selected Brali design reference"></figure>
    <figure><figcaption>Implemented homepage · 1440 × 1024 CSS viewport</figcaption><img src="/reports/design-home-desktop-final.png" alt="Implemented Brali homepage"></figure>
  </main>
</body>
</html>
