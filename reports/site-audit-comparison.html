<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brali site-wide visual audit comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; background: #07162b; color: #fffdf3; font: 600 16px/1.4 Manrope, Arial, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 38px; }
    .intro { margin: 0 0 32px; color: #b9c8da; font-weight: 500; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 0 0 34px; }
    figure { margin: 0; padding: 14px; border: 1px solid #39506a; border-radius: 18px; background: #10233c; }
    figcaption { margin: 0 0 10px; color: #ffd335; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
    img { display: block; width: 100%; height: 420px; object-fit: cover; object-position: top; border-radius: 10px; background: #fffdf3; }
    .mobile img { height: 520px; object-fit: contain; }
  </style>
</head>
<body>
  <h1>Brali site-wide readability pass</h1>
  <p class="intro">Current-run before/after comparison at matched viewports.</p>

  <div class="row">
    <figure><figcaption>Protocol detail · before</figcaption><img src="site-audit-05-protocol-before-desktop.png" alt="Protocol page before typography refinements"></figure>
    <figure><figcaption>Protocol detail · after</figcaption><img src="site-audit-28-protocol-after-desktop.png" alt="Protocol page after typography refinements"></figure>
  </div>

  <div class="row">
    <figure><figcaption>Research · before</figcaption><img src="site-audit-06-research-before-desktop.png" alt="Research page before readability refinements"></figure>
    <figure><figcaption>Research · after</figcaption><img src="site-audit-29-research-after-desktop.png" alt="Research page after readability refinements"></figure>
  </div>

  <div class="row mobile">
    <figure><figcaption>Query mobile · before</figcaption><img src="site-audit-23-query-mobile-before.png" alt="Query page mobile before typography refinements"></figure>
    <figure><figcaption>Query mobile · after</figcaption><img src="site-audit-39-query-mobile-final.jpg" alt="Query page mobile after typography refinements"></figure>
  </div>
</body>
</html>
