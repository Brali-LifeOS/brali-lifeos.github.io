<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brali mobile H1 comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #07162b; color: #fffdf3; font: 700 15px/1.4 Manrope, Arial, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0 0 24px; color: #b9c8da; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    figure { margin: 0; padding: 12px; border: 1px solid #39506a; border-radius: 16px; background: #10233c; }
    figcaption { margin-bottom: 8px; color: #ffd335; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    img { display: block; width: 100%; border-radius: 8px; background: #fffdf3; }
  </style>
</head>
<body>
  <h1>Mobile internal H1 scale</h1>
  <p>Same 390 px viewport. Homepage hero remains unchanged.</p>
  <div class="grid">
    <figure><figcaption>Problem · previous</figcaption><img src="site-audit-24-problem-after-mobile.png" alt="Previous mobile problem heading"></figure>
    <figure><figcaption>Problem · reduced</figcaption><img src="site-audit-41-problem-h1-mobile-final.jpg" alt="Reduced mobile problem heading"></figure>
    <figure><figcaption>Query · previous</figcaption><img src="site-audit-23-query-after-mobile.png" alt="Previous mobile query heading"></figure>
    <figure><figcaption>Query · reduced</figcaption><img src="site-audit-42-query-h1-mobile-final.jpg" alt="Reduced mobile query heading"></figure>
  </div>
</body>
</html>
